<!-- 카카오톡·메신저 링크 미리보기용 (제목·설명·표지 이미지 파일명을 바꿔 주세요) -->
<title>멘사코리아 회지 Vol.126</title>
<meta property="og:title" content="멘사코리아 회지 Vol.126 (2026년 6월호)">
<meta property="og:description" content="멘사코리아 회원 소식지">
<meta property="og:image" content="cover.jpg">
<meta property="og:type" content="website">
<!-- ============================================================ -->

<style>
  :root{
    --bg:#ebe8e2; --bg2:#d6d2c9; --fg:#1d1f22; --muted:#6b7078;
    --panel:rgba(255,255,255,.78); --panel-line:rgba(0,0,0,.07); --accent:#2f6df6;
    --shadow:0 10px 30px rgba(0,0,0,.22);
  }
  [hidden]{display:none!important}
  [data-theme="dark"]{
    --bg:#1e2126; --bg2:#0e1013; --fg:#eef0f3; --muted:#9aa1ab;
    --panel:rgba(28,30,35,.78); --panel-line:rgba(255,255,255,.08);
    --shadow:0 14px 36px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{position:fixed;inset:0}
  body{
    background:var(--bgc, radial-gradient(ellipse at 50% 35%, var(--bg) 0%, var(--bg2) 100%));
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:14px; user-select:none; -webkit-user-select:none;
  }
  button{font-family:inherit}
  #app{position:absolute;inset:0;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  /* ---- 상단 ---- */
  #top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
  #brand{display:flex;align-items:center;gap:10px;min-width:0}
  #brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  #title{font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topbtns{display:flex;gap:6px}

  .ib{appearance:none;border:0;background:transparent;color:var(--fg);width:40px;height:40px;border-radius:12px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s;text-decoration:none}
  .ib:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
  .ib:active{transform:scale(.94)}
  .ib:disabled{opacity:.3;cursor:default}
  .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ib.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

  /* ---- 책 영역 ---- */
  #area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  #book{position:relative;flex:none;transition:opacity .4s;opacity:0}
  #book.show{opacity:1}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;
    background:var(--panel);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer;z-index:20;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s,transform .1s}
  .arrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .arrow:hover{transform:translateY(-50%) scale(1.06)}
  .arrow:disabled{opacity:0;pointer-events:none}
  #prev{left:18px} #next{right:18px}

  /* StPageFlip 필수 스타일 */
  .stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0)}
  .stf__wrapper{position:relative;width:100%;height:100%;box-sizing:border-box}
  .stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2000px}
  .stf__item{display:none;position:absolute;transform-style:preserve-3d}
  .stf__outerShadow,.stf__innerShadow,.stf__hardShadow,.stf__hardInnerShadow{position:absolute;left:0;top:0}

  /* 페이지 */
  .page{background:#fff;box-shadow:var(--shadow)}
  .pg{position:relative;width:100%;height:100%;overflow:hidden;background:#fafafa}
  .pg canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .pg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c2c2c2;font-size:13px;letter-spacing:.06em}
  .page.ready .ph{display:none}
  .pg .links{position:absolute;inset:0}
  .pg .links a{position:absolute;display:block;border-radius:3px;cursor:pointer}
  .pg .links a:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .pg::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
  .--left .pg::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.10),rgba(0,0,0,0))}
  .--right .pg::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.10),rgba(0,0,0,0))}
  body.portrait .pg::after{display:none}

  /* ---- 하단 ---- */
  #bottom{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 16px 12px}
  #slider{-webkit-appearance:none;appearance:none;width:min(560px,100%);height:22px;background:transparent;cursor:pointer;margin:0}
  #slider::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--pct,0%),color-mix(in srgb,var(--fg) 15%,transparent) var(--pct,0%))}
  #slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent);margin-top:-5.5px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  #slider::-moz-range-track{height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 15%,transparent)}
  #slider::-moz-range-progress{height:3px;background:var(--accent)}
  #slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
  #tools{display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-line);
    box-shadow:0 8px 28px rgba(0,0,0,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #pageinfo{min-width:84px;text-align:center;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;color:var(--fg);padding:0 4px}
  #pageinfo small{color:var(--muted);font-weight:500}
  .sep{width:1px;height:22px;background:var(--panel-line);margin:0 4px}

  /* ---- 썸네일 ---- */
  #thumbs{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--panel-line);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
  #thumbs.open{transform:translateY(0)}
  #thumbs .hd{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px;font-size:13px;color:var(--muted)}
  #thumbs .hd b{color:var(--fg);font-weight:600}
  #thumbs .track{display:flex;gap:12px;overflow-x:auto;padding:6px 18px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
  .th{flex:none;width:96px;cursor:pointer;scroll-snap-align:center;text-align:center;color:var(--muted);font-size:11px}
  .th .fr{width:96px;aspect-ratio:var(--r,0.707);background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden;border:2px solid transparent;transition:transform .15s,border-color .15s}
  .th canvas{width:100%;height:100%;display:block}
  .th:hover .fr{transform:translateY(-2px)}
  .th.on .fr{border-color:var(--accent)}
  .th.on{color:var(--accent);font-weight:600}
  .th span{display:block;margin-top:6px}

  /* ---- 확대 보기 ---- */
  #zoom{position:absolute;inset:0;z-index:60;background:#141518;display:flex;flex-direction:column;color:#fff}
  #zoom[hidden]{display:none}
  #zoomBar{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;padding-top:env(safe-area-inset-top)}
  #zoomBar .grp{display:flex;align-items:center;gap:2px}
  #zoomBar .ib{color:#fff}
  #zoomBar .ib:hover{background:rgba(255,255,255,.12)}
  #zoomInfo{font-size:13px;color:#cfd3d9;padding:0 8px;font-variant-numeric:tabular-nums}
  #zoomScroll{flex:1;overflow:auto;cursor:grab;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
  #zoomScroll.drag{cursor:grabbing}
  #zoomInner{display:flex;justify-content:safe center;align-items:flex-start;gap:0;padding:12px;min-width:100%;min-height:100%;width:max-content}
  #zoomInner canvas{height:var(--zh,800px);width:auto;display:block;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}


  /* ---- 사이드 패널 (목차 / 추적 로그) ---- */
  .side{position:absolute;top:0;bottom:0;width:360px;max-width:100%;z-index:45;background:var(--panel);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .side.left{left:0;border-right:1px solid var(--panel-line);transform:translateX(-100%)}
  .side.right{right:0;border-left:1px solid var(--panel-line);transform:translateX(100%)}
  .side.open{transform:none}
  .side .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 18px}
  .side .hd b{font-size:14px;font-weight:650}
  .side .hd small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .side .list{flex:1;overflow:auto;padding:4px 12px 16px}
  @media (max-width:700px){
    .side{top:auto;left:0;right:0;bottom:0;width:auto;height:62%;border:0;border-top:1px solid var(--panel-line);transform:translateY(100%);padding-top:0}
    .side.left,.side.right{transform:translateY(100%)}
    .side.open{transform:none}
  }
  /* 목차 */
  .toc-sec{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px;font-weight:650;display:flex;align-items:center;gap:6px}
  .toc-sec .tt{flex:1}
  .toc-it{display:flex;align-items:baseline;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.35}
  .toc-it:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
  .toc-it.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
  .toc-it .tt{flex:0 1 auto;min-width:0}
  .toc-it .dots{flex:1 1 0;min-width:10px;border-bottom:1px dotted color-mix(in srgb,var(--fg) 30%,transparent);transform:translateY(-4px)}
  .toc-it .pn{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;flex:none}
  .toc-it.on .pn{color:var(--accent)}
  .toc-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}
  .ops{display:none;gap:2px;margin-left:4px;flex:none}
  body.editing .ops{display:flex}
  .ops button{width:26px;height:24px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;font-size:12px;line-height:1;padding:0;font-family:inherit}
  .ops button:hover{background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg)}
  .ops button.pgset{font-size:11px;width:auto;padding:0 5px}
  #tocEdit{padding:10px 12px 14px;border-top:1px solid var(--panel-line);display:flex;flex-direction:column;gap:8px;flex:none;max-height:55%;overflow:auto}
  #tocEdit .row{display:flex;gap:6px}
  #tocEdit input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--panel-line);border-radius:8px;background:color-mix(in srgb,var(--fg) 4%,transparent);color:var(--fg);font:inherit;font-size:13px}
  #tocEdit input:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:1px}
  .btn{padding:8px 12px;border-radius:8px;border:1px solid var(--panel-line);background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:color-mix(in srgb,var(--fg) 10%,transparent)}
  .btn.pri{background:var(--accent);color:#fff;border-color:transparent}
  .btn.pri:hover{filter:brightness(1.08)}
  #tocCode{width:100%;height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.4;padding:8px;border-radius:8px;border:1px solid var(--panel-line);background:color-mix(in srgb,var(--fg) 4%,transparent);color:var(--fg)}
  #tocEdit .hint{font-size:11.5px;color:var(--muted);line-height:1.5}
  .pill{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;margin-left:6px;vertical-align:middle}

  /* ---- 추적 로그 (테스트용) ---- */
  #logBtn{position:relative}
  #logBtn .n{position:absolute;top:4px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .ev{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:color-mix(in srgb,var(--fg) 5%,transparent);font-size:12px;line-height:1.45;animation:evin .25s ease-out}
  @keyframes evin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .ev .t{display:flex;justify-content:space-between;gap:8px}
  .ev .t b{color:var(--accent);font-weight:650}
  .ev .t span{color:var(--muted);font-variant-numeric:tabular-nums}
  .ev code{display:block;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-all}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

  /* ---- 로더 / 토스트 ---- */
  #loader{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--bgc, radial-gradient(ellipse at 50% 35%, var(--bg) 0%, var(--bg2) 100%));transition:opacity .5s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .book{width:54px;height:40px;position:relative}
  #loader .book i{position:absolute;inset:0;border-radius:4px 8px 8px 4px;background:var(--accent);opacity:.9;transform-origin:left center;animation:flip 1.6s ease-in-out infinite}
  #loader .book i:nth-child(2){animation-delay:.25s;opacity:.55}
  #loader .book i:nth-child(3){animation-delay:.5s;opacity:.3}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(-160deg)}100%{transform:rotateY(0)}}
  #loader .t{font-weight:600;font-size:15px}
  #loader .s{font-size:13px;color:var(--muted)}
  #loader .bar{width:180px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
  #loader .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #loader.err .t{color:#d64545}
  #toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);z-index:90;
    background:rgba(28,30,35,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:700px){
    #top{height:50px;padding:0 10px}
    #title{font-size:14px}
    .arrow{display:none}
    #bottom{padding:4px 12px 10px;gap:6px}
    .ib{width:38px;height:38px}
    #pageinfo{min-width:72px;font-size:13px}
    #zoomInner{padding:6px}
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand"><span class="dot"></span><span id="title"></span></div>
    <div id="topbtns">
      <button id="logBtn" class="ib" title="추적 로그" aria-label="추적 로그" hidden><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span class="n">0</span></button>
      <button id="shareBtn" class="ib" title="공유" aria-label="공유"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
      <a id="dl" class="ib" title="PDF 저장" aria-label="PDF 저장" download hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></a>
    </div>
  </header>

  <main id="area">
    <button id="prev" class="arrow" aria-label="이전 페이지"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="book"></div>
    <button id="next" class="arrow" aria-label="다음 페이지"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </main>

  <footer id="bottom">
    <input id="slider" type="range" min="1" max="1" value="1" aria-label="페이지 이동">
    <div id="tools">
      <button id="tocBtn" class="ib" title="목차" aria-label="목차" hidden><svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h16M4 18h10"/><circle cx="19" cy="6" r="1" fill="currentColor"/><circle cx="17" cy="18" r="1" fill="currentColor"/></svg></button>
      <button id="thumbsBtn" class="ib" title="페이지 보기" aria-label="페이지 보기"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <span class="sep"></span>
      <button id="prevBtn" class="ib" title="이전" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="pageinfo">– <small>/ –</small></div>
      <button id="nextBtn" class="ib" title="다음" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="sep"></span>
      <button id="zoomBtn" class="ib" title="확대해서 읽기" aria-label="확대"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg></button>
      <button id="fsBtn" class="ib" title="전체화면" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </footer>
</div>

<div id="thumbs">
  <div class="hd"><span><b>페이지</b> <span id="thumbsCount"></span></span><button id="thumbsClose" class="ib" style="width:32px;height:32px" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="track" id="thumbTrack"></div>
</div>

<div id="toc" class="side left">
  <div class="hd"><div><b>목차<span id="tocEditPill" class="pill" hidden>편집 모드</span></b><small id="tocSub"></small></div><button id="tocClose" class="ib" style="width:32px;height:32px" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="list" id="tocList"></div>
  <div id="tocEdit" hidden>
    <div class="row"><input id="tocTitle" placeholder="글 제목" maxlength="80"><button id="tocAdd" class="btn pri">+ 현재 쪽에 추가</button></div>
    <div class="row"><input id="tocSecName" placeholder="구분 이름 (예: 커버스토리)" maxlength="40"><button id="tocAddSec" class="btn">+ 구분 추가</button></div>
    <div class="row"><button id="tocCopy" class="btn pri" style="flex:1">설정 코드 복사</button><button id="tocReset" class="btn">비우기</button></div>
    <textarea id="tocCode" readonly spellcheck="false"></textarea>
    <div class="hint">항목 옆 <b>쪽</b>을 누르면 지금 보고 있는 쪽으로 바뀝니다. 다 만든 뒤 <b>설정 코드 복사</b> → viewer.html 의 <code>TOC: [ ... ]</code> 자리에 붙여넣고 업로드하면 모든 독자에게 적용됩니다. (편집 내용은 이 브라우저에만 임시 저장됩니다)</div>
  </div>
</div>

<div id="log" class="side right">
  <div class="hd"><div><b>추적 로그</b><small>이 데이터가 GA4로 전송됩니다</small></div><button id="logClose" class="ib" style="width:32px;height:32px" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="list" id="logList"></div>
</div>

<div id="zoom" hidden>
  <div id="zoomBar">
    <div class="grp"><span id="zoomInfo"></span></div>
    <div class="grp">
      <button id="zoomOut" class="ib" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zoomIn" class="ib" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomClose" class="ib" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div id="zoomScroll"><div id="zoomInner"></div></div>
</div>

<div id="loader">
  <div class="book"><i></i><i></i><i></i></div>
  <div class="t" id="loaderTitle"></div>
  <div class="s" id="loaderMsg">회지를 준비하고 있어요</div>
  <div class="bar"><i id="loaderBar"></i></div>
</div>
<div id="toast"></div>

<script>
(function(){
  'use strict';
  const cfg = window.ZINE_CONFIG || {};
  const qs  = new URLSearchParams(location.search);

  /* ---------- 설정 해석 ---------- */
  const ZINE_ID = (qs.get('zine') || cfg.ZINE_ID || 'zine').replace(/[^a-z0-9_]/gi, '_').toLowerCase();
  let PDF_URL = cfg.PDF_URL || 'zine.pdf';
  const qpdf = qs.get('pdf');                       // ?pdf= 는 같은 서버의 상대경로만 허용
  if (qpdf && !/^(\/\/|[a-z]+:)/i.test(qpdf) && !qpdf.includes('..')) PDF_URL = qpdf;
  const TITLE = cfg.TITLE || '회지';
  document.documentElement.dataset.theme = cfg.THEME === 'dark' ? 'dark' : 'light';
  if (cfg.ACCENT) document.documentElement.style.setProperty('--accent', cfg.ACCENT);
  if (cfg.BACKGROUND) document.documentElement.style.setProperty('--bgc', cfg.BACKGROUND);
  document.title = TITLE;

  /* ---------- 추적 (GA4) ---------- */
  let gtagReady = false;
  if (cfg.GA4_ID) {
    const s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(cfg.GA4_ID);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', cfg.GA4_ID, { page_title: TITLE, transport_type: 'beacon' });
    gtagReady = true;
  }
  function track(name, params){
    const p = Object.assign({ zine_id: ZINE_ID }, params || {});
    if (gtagReady) gtag('event', name, p);
    else console.log('[zine-track]', name, JSON.stringify(p));
    try { window.dispatchEvent(new CustomEvent('zine:track', { detail: { name, params: p } })); } catch(e){}
  }

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const areaEl=$('area'), bookEl=$('book'), sliderEl=$('slider'), pageInfo=$('pageinfo'),
        prevA=$('prev'), nextA=$('next'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn'),
        thumbsEl=$('thumbs'), thumbTrack=$('thumbTrack'), thumbsBtn=$('thumbsBtn'),
        zoomEl=$('zoom'), zoomScroll=$('zoomScroll'), zoomInner=$('zoomInner'), zoomInfo=$('zoomInfo'),
        loader=$('loader'), loaderBar=$('loaderBar'), loaderMsg=$('loaderMsg'), toastEl=$('toast'), dl=$('dl');
  $('title').textContent = TITLE; $('loaderTitle').textContent = TITLE;

  /* ---------- 상태 ---------- */
  let pdf=null, N=0, ratio=0.707, pageFlip=null, portrait=false, pageCssW=0;
  const pages=[];                      // {el, canvas, links, rendered, renderedW, rendering, dirty, annots}
  let visible=[], enteredAt=0, totalSec=0, maxPage=0, exitSent=false;
  const seen=new Set(), pageCache=new Map();
  const getPage = n => { if (!pageCache.has(n)) pageCache.set(n, pdf.getPage(n)); return pageCache.get(n); };

  /* ---------- 체류시간 / 이탈 ---------- */
  function flushTime(){
    if (!visible.length || !enteredAt) return;
    const sec = Math.round((performance.now() - enteredAt) / 1000);
    enteredAt = performance.now();
    if (sec <= 0) return;
    totalSec += sec;
    for (const i of visible) track('zine_page_time', { page_number: i+1, engagement_seconds: sec, view_mode: portrait ? 'single' : 'spread' });
  }
  function sendExit(){
    if (exitSent || !N) return;
    exitSent = true; flushTime();
    track('zine_exit', { last_page: (visible[0]||0)+1, max_page: maxPage, page_count: N, pages_viewed: seen.size,
                         total_seconds: totalSec, read_pct: Math.round(maxPage / N * 100) });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') sendExit();
    else { exitSent = false; enteredAt = performance.now(); }
  });
  window.addEventListener('pagehide', sendExit);

  /* ---------- 토스트 ---------- */
  let toastT;
  function toast(msg, ms){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms || 2200); }

  /* ---------- 레이아웃 ---------- */
  const MIN_PAGE_W = 300;
  function layout(){
    const r = areaEl.getBoundingClientRect();
    const small = window.innerWidth < 700;
    const padX = small ? 10 : 90, padY = small ? 10 : 24;
    const W = Math.max(100, r.width - padX*2), H = Math.max(100, r.height - padY*2);
    let pH = Math.min(H, (W/2)/ratio), pW = pH*ratio;
    const wantPortrait = (r.width < r.height) || pW < MIN_PAGE_W;
    if (wantPortrait) { pH = Math.min(H, W/ratio); pW = pH*ratio; }
    portrait = wantPortrait;
    document.body.classList.toggle('portrait', portrait);
    pageCssW = Math.floor(pW);
    bookEl.style.width  = Math.floor(portrait ? pW : pW*2) + 'px';
    bookEl.style.height = Math.floor(pH) + 'px';

  /* ---------- 페이지 렌더링 ---------- */
  async function renderPage(i){
    const P = pages[i]; if (!P || !pdf) return;

    if (P.rendering) { P.dirty = true; return; }

    P.rendering = true;
    try {
      const page = await getPage(i+1);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: targetW / base.width });
      const c = P.canvas;
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      await page.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp }).promise;
      P.rendered = true; P.renderedW = targetW; P.el.classList.add('ready');
      if (!P.annots) { P.annots = await page.getAnnotations({ intent: 'display' }); buildLinks(P, i, base); }

  }

    const want = new Set();
    order.forEach(i => { if (i >= 0 && i < N) { want.add(i); renderPage(i); } });

  function linkLabel(url){ try { const u = new URL(url); return u.searchParams.get('utm_content') || u.hostname; } catch(e){ return ''; } }

    P.links.innerHTML = '';

      if (a.subtype !== 'Link' || !(a.url || a.dest)) continue;
      const r = base.convertToViewportRectangle(a.rect);
      const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]), w = Math.abs(r[2]-r[0]), h = Math.abs(r[3]-r[1]);

    }
  }

  /* ---------- 현재 펼침면 변경 ---------- */

  /* ---------- 확대 보기 ---------- */
  let zoomScale = 1, zoomBaseH = 0;

  async function openZoom(){
    if (!pdf || !visible.length) return;

  };

  }

  const LS_KEY = 'zine_toc_draft_' + ZINE_ID;

  function ops(i){

    if (toc[i].title != null) mk('쪽', '지금 보는 쪽으로 바꾸기', () => { toc[i].page = shownPage(); saveDraft(); }, 'pgset');
    mk('↑', '위로', () => { if (i > 0) { [toc[i-1], toc[i]] = [toc[i], toc[i-1]]; saveDraft(); } });
    mk('↓', '아래로', () => { if (i < toc.length-1) { [toc[i+1], toc[i]] = [toc[i], toc[i+1]]; saveDraft(); } });

  /* ---------- 추적 로그 패널 (테스트용) ---------- */
  if (cfg.SHOW_EVENT_LOG) {

    const LABEL={zine_open:'뷰어 열림',zine_page_view:'페이지 조회',zine_page_time:'페이지 체류',zine_link_click:'광고 링크 클릭',zine_internal_link:'내부 링크',

  /* ---------- 리사이즈 ---------- */
  let rT;

  (async function init(){

    ratio = bv.width / bv.height;
    sliderEl.max = N;
    loaderBar.style.width = '100%';
    track('zine_open', { page_count: N, referrer: document.referrer.slice(0,200) });
    await loadOutlineIfEmpty();
    tocBtn.hidden = !(toc.length || EDIT);
    if (EDIT) setTimeout(openToc, 600);

    // 페이지 요소 생성
    for (let i = 0; i < N; i++) {
      const el = document.createElement('div'); el.className = 'page';
      el.dataset.density = (i === 0 || i === N-1) ? 'hard' : 'soft';
      el.innerHTML = `<div class="pg"><canvas></canvas><div class="links"></div><div class="ph">${i+1}</div></div>`;
      bookEl.appendChild(el);
      pages.push({ el, canvas: el.querySelector('canvas'), links: el.querySelector('.links'), rendered:false, renderedW:0, rendering:false, dirty:false, annots:null });
    }
    layout();
    const startIdx = Math.max(0, Math.min(N-1, (parseInt((location.hash.match(/p=(\d+)/)||[])[1],10) || parseInt(qs.get('p')||'1',10) || 1) - 1));
    await renderPage(startIdx);
    if (!portrait && startIdx > 0 && startIdx+1 < N) await renderPage(startIdx % 2 ? startIdx+1 : startIdx-1);

    pageFlip = new St.PageFlip(bookEl, {
      width: Math.round(ratio*1000), height: 1000, size: 'stretch',
      minWidth: 1, maxWidth: 10000, minHeight: 1, maxHeight: 10000,
      usePortrait: true, autoSize: false, showCover: true, drawShadow: true, maxShadowOpacity: 0.35,
      flippingTime: 750, mobileScrollSupport: false, swipeDistance: 25, startPage: startIdx, showPageCorners: true
    });
    pageFlip.on('flip', onSpreadChange);
    pageFlip.on('changeOrientation', () => setTimeout(onSpreadChange, 0));
    pageFlip.on('init', () => { onSpreadChange(); });
    pageFlip.loadFromHTML(pages.map(p => p.el));
    bookEl.style.minWidth = '0'; bookEl.style.minHeight = '0';      // 라이브러리가 넣은 min-width 제거
    pageFlip.getSettings().minWidth = portrait ? 1e6 : 1;
    pageFlip.update();
    onSpreadChange();

    bookEl.classList.add('show');
    loader.classList.add('hide');
    setTimeout(() => { if (window.innerWidth < 700) toast('좌우로 밀어서 넘겨 보세요', 2600); }, 900);
  })();
})();
</script>
</body>
</html>
